<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create and deploy ERC-20 and BEP-20 tokens on 9 chains without writing Solidity. Free honeypot and rug-pull scanning, airdrops, cross-chain bridging and audit reports." />
    <link rel="canonical" href="https://fatdev.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FatDev" />
    <meta property="og:title" content="FatDev — Deploy, Scan and Launch Tokens Without Code" />
    <meta property="og:description" content="Create and deploy ERC-20 and BEP-20 tokens on 9 chains without writing Solidity. Free honeypot and rug-pull scanning, airdrops, cross-chain bridging and audit reports." />
    <meta property="og:url" content="https://fatdev.org/" />
    <!-- Absolute, not root-relative: X, Telegram, Discord and LinkedIn all
         reject a relative og:image, which is why link previews were blank. -->
    <meta property="og:image" content="https://fatdev.org/logo-full.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FatDev — Deploy, Scan and Launch Tokens Without Code" />
    <meta name="twitter:description" content="Free honeypot and rug-pull scanning, no-code token deployment on 9 chains, airdrops and cross-chain bridging." />
    <meta name="twitter:image" content="https://fatdev.org/logo-full.png" />
    <title>FatDev — Deploy, Scan and Launch Tokens Without Code</title>
    <script>
      // Applied before first paint — a flash of the wrong palette is jarring.
      try {
        var t = localStorage.getItem('fatdev-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
